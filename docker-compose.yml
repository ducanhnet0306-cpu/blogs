services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: enterprise_blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      GIN_MODE: debug
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "123456"
      DB_NAME: enterprise_blog
      JWT_SECRET: enterprise_blog_jwt_secret_key_2026_do_not_share
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/root/uploads

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
